name: Habana Labs
description: >-
  Habana Labs is an artificial-intelligence processor company, now part of Intel, that designs
  deep-learning accelerators for AI training and inference. Its Gaudi (training) and Goya
  (inference) processors — sold today as the Intel Gaudi 2 and Gaudi 3 AI accelerators — are
  programmed through the SynapseAI software suite, which integrates with PyTorch and DeepSpeed
  and ships reference models, containers, and installation tooling. Habana was founded in 2016
  in Israel and acquired by Intel in 2019. Its public developer surface is not a hosted web API
  but an open-source SDK and toolchain: the HabanaAI GitHub organization (reference models,
  PyTorch bridge, setup/install, plus vLLM and Megatron forks) and the Intel Gaudi documentation
  at docs.habana.ai. This profile catalogs that developer footprint for the API Evangelist network.
